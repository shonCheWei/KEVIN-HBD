<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>寶寶生日快樂嗚</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    :root {
      --bg-dark: #070708;
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-muted: rgba(255, 255, 255, 0.56);
      --glass-bg: rgba(14, 14, 16, 0.45);
      --glass-border: rgba(255, 255, 255, 0.16);
      --font-sans: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: none;
    }

    body {
      background-color: var(--bg-dark);
      overflow-x: hidden;
      width: 100%;
    }

    /* 膠卷顆粒與四邊暗角 */
    .film-grain {
      position: fixed;
      inset: -12%;
      width: 124%;
      height: 124%;
      pointer-events: none;
      z-index: 40;
      opacity: 0.042;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grainShift 0.7s steps(2) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1.5%, 1%); }
      50% { transform: translate(1%, -1.5%); }
      75% { transform: translate(-1%, -0.5%); }
      100% { transform: translate(1.5%, 1%); }
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 39;
      opacity: 0;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(0, 0, 0, 0) 48%,
        rgba(0, 0, 0, 0.36) 82%,
        rgba(0, 0, 0, 0.78) 100%
      );
    }

    /* 背景有機光影 Canvas */
    #organic-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
      opacity: 0.62;
    }

    /* 角落音樂控制 */
    .corner-music-btn {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.14em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, background 0.3s ease;
    }

    .corner-music-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .eq-bars span {
      display: block;
      width: 1.5px;
      height: 3px;
      background: rgba(255, 255, 255, 0.85);
      transition: height 0.2s ease;
    }

    .corner-music-btn.playing .eq-bars span:nth-child(1) { animation: eqPulse 0.9s ease-in-out infinite alternate; }
    .corner-music-btn.playing .eq-bars span:nth-child(2) { animation: eqPulse 0.65s ease-in-out 0.2s infinite alternate; }
    .corner-music-btn.playing .eq-bars span:nth-child(3) { animation: eqPulse 1.1s ease-in-out 0.1s infinite alternate; }

    @keyframes eqPulse {
      0% { height: 2px; }
      100% { height: 10px; }
    }

    /* 進度細線 */
    .scroll-track {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 1.5px;
      height: 84px;
      background: rgba(255, 255, 255, 0.14);
      z-index: 50;
      pointer-events: none;
      border-radius: 2px;
      overflow: hidden;
    }

    .scroll-thumb {
      width: 100%;
      height: 0%;
      background: rgba(255, 255, 255, 0.72);
    }

    /* 場景與滿版底圖 */
    .story-container {
      position: relative;
      width: 100%;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background-color: var(--bg-dark);
    }

    .scene-bg-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #1d1e24 0%, #09090b 100%);
    }

    .scene-bg {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.03) saturate(0.92);
      will-change: transform, filter;
    }

    .scene-shade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(6, 6, 8, 0.36) 0%,
        rgba(6, 6, 8, 0.44) 48%,
        rgba(6, 6, 8, 0.64) 100%
      );
    }

    /* 第一張封面一開始完全透明，往下捲動時才慢慢進到半透明遮罩 */
    #scene-cover .scene-shade {
      opacity: 0;
    }

    /* Section 6 內部純黑轉場幕布：位於照片上方、文字舞台下方 */
    .finale-curtain {
      position: absolute;
      inset: 0;
      z-index: 4;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
    }

    /* 封面底部按鈕 */
    .cover-ui {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0 24px max(52px, env(safe-area-inset-bottom));
      text-align: center;
    }

    .play-trigger {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 24px;
      border-radius: 999px;
      background: rgba(12, 12, 14, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.36);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
    }

    .play-trigger:active {
      transform: scale(0.96);
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 7px solid #ffffff;
    }

    .scroll-cue {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.28em;
    }

    .scroll-line {
      width: 1px;
      height: 26px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0));
      animation: cueDrop 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes cueDrop {
      0% { transform: scaleY(0); transform-origin: top; opacity: 0; }
      45% { transform: scaleY(1); transform-origin: top; opacity: 1; }
      55% { transform: scaleY(1); transform-origin: bottom; opacity: 1; }
      100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
    }

    /* 前景文字舞台（層級高於純黑幕布） */
    .text-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* 每一段文字獨立容器，預設完全隱藏避免互相重疊 */
    .beat-layer {
      position: absolute;
      inset: 0;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
    }

    /* 全站統一文青細體字級，無粗體、無忽大忽小 */
    .poem-line {
      font-family: var(--font-sans);
      font-size: clamp(14px, 3.8vw, 15.5px);
      font-weight: 300;
      line-height: 2.25;
      letter-spacing: 0.14em;
      color: var(--text-primary);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      will-change: transform, opacity, filter;
      max-width: 100%;
    }

    .poem-line.gap-top {
      margin-top: 20px;
    }

    /* Section 4 自由節奏排版 */
    .scatter-layer {
      position: absolute;
      inset: 0;
      padding: 16vh 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
    }

    .scatter-line {
      font-family: var(--font-sans);
      font-size: clamp(14px, 3.8vw, 15.5px);
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: 0.16em;
      color: var(--text-primary);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      will-change: transform, opacity, filter;
    }

    .align-left { align-self: flex-start; text-align: left; }
    .align-right { align-self: flex-end; text-align: right; }
    .align-center { align-self: center; text-align: center; }

    /* 音樂未設定時的輕提示 */
    .audio-toast {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 80;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 15, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.1em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }

    .audio-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="film-grain" aria-hidden="true"></div>
  <div class="vignette-overlay" id="vignette-overlay" aria-hidden="true"></div>
  <canvas id="organic-canvas" aria-hidden="true"></canvas>

  <button class="corner-music-btn" id="corner-music-btn" type="button" aria-label="切換音樂播放">
    <span class="eq-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="corner-music-label">MUSIC</span>
  </button>

  <div class="scroll-track" aria-hidden="true">
    <div class="scroll-thumb" id="scroll-thumb"></div>
  </div>

  <div class="audio-toast" id="audio-toast"></div>
  <audio id="bg-audio" loop preload="auto" playsinline></audio>

  <main class="story-container" id="story-container">

    <!-- Cover：一開始黑色半透明遮罩全透明，往下捲動時在原地慢慢進到半透明 -->
    <section class="scene" id="scene-cover">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-cover" alt="" />
      </div>
      <div class="scene-shade" id="cover-shade"></div>
      <div class="cover-ui" id="cover-ui">
        <button class="play-trigger" id="hero-play-btn" type="button">
          <span class="play-triangle" aria-hidden="true"></span>
          <span id="hero-play-text">Play Music</span>
        </button>
        <div class="scroll-cue" aria-hidden="true">
          <span>SCROLL</span>
          <span class="scroll-line"></span>
        </div>
      </div>
    </section>

    <!-- Section 1 -->
    <section class="scene" id="scene-1">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-sec1" alt="" />
      </div>
      <div class="scene-shade"></div>
      <div class="text-stage">
        <div class="beat-layer" id="sec1-group"></div>
      </div>
    </section>

    <!-- Section 2 -->
    <section class="scene" id="scene-2">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-sec2" alt="" />
      </div>
      <div class="scene-shade"></div>
      <div class="text-stage">
        <div class="beat-layer" id="sec2-group-a"></div>
        <div class="beat-layer" id="sec2-group-b"></div>
      </div>
    </section>

    <!-- Section 3 -->
    <section class="scene" id="scene-3">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-sec3" alt="" />
      </div>
      <div class="scene-shade"></div>
      <div class="text-stage">
        <div class="beat-layer" id="sec3-group-a"></div>
        <div class="beat-layer" id="sec3-group-b"></div>
      </div>
    </section>

    <!-- Section 4 -->
    <section class="scene" id="scene-4">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-sec4" alt="" />
      </div>
      <div class="scene-shade"></div>
      <div class="text-stage">
        <div class="scatter-layer" id="sec4-group-a"></div>
        <div class="scatter-layer" id="sec4-group-b"></div>
        <div class="beat-layer" id="sec4-group-c"></div>
      </div>
    </section>

    <!-- Section 5 -->
    <section class="scene" id="scene-5">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-sec5" alt="" />
      </div>
      <div class="scene-shade"></div>
      <div class="text-stage">
        <div class="beat-layer" id="sec5-group-a"></div>
        <div class="beat-layer" id="sec5-group-b"></div>
        <div class="beat-layer" id="sec5-group-c"></div>
      </div>
    </section>

    <!-- Section 6（最後三句出現前，背景先轉為純黑） -->
    <section class="scene" id="scene-6">
      <div class="scene-bg-wrap">
        <img class="scene-bg" id="img-sec6" alt="" />
      </div>
      <div class="scene-shade"></div>
      <div class="finale-curtain" id="finale-curtain"></div>
      <div class="text-stage">
        <div class="beat-layer" id="sec6-group-a"></div>
        <div class="beat-layer" id="sec6-group-b"></div>
        <div class="beat-layer" id="sec6-group-finale"></div>
      </div>
    </section>

  </main>

  <script>
    /* ==========================================================================
       集中設定區（SITE_CONFIG）— 替換照片、音樂與文字只需修改這裡
       ========================================================================== */
    const SITE_CONFIG = {
      // 1. 背景音樂路徑：把音樂檔放在同資料夾（例如 "music.mp3"）後填入下方引號內
      musicUrl: "video.mp3",
      playButtonText: "Play Music",

      // 2. 七張滿版照片路徑：建議建立 images 資料夾並依序替換（例如 "./images/cover.jpg"）
      images: {
        cover: "./images/cover.png",
        sec1:  "./images/1.jpg",
        sec2:  "./images/2.jpg",
        sec3:  "./images/3.jpg",
        sec4:  "./images/4.jpg",
        sec5:  "./images/5.jpg",
        sec6:  "./images/6.jpg"
      },

      // 3. 各場景文案（全站統一字級，無標題、無粗體）
      texts: {
        sec1: [
          "生日快樂！",
          "今年又做了一個奇怪的東西給你。",
          "希望寶寶會喜歡 :3"
        ],
        sec2: {
          groupA: [
            "2022 年 7 月，我們認識了。",
            "2022 年 9 月 15 日，我們在一起了。",
            "2023 年，一週年。",
            "2024 年，二週年。",
            "2025 年，三週年。",
            "2026 年，四週年。"
          ],
          groupB: [
            "竟然就這樣四年了耶！",
            "中間還一起過了好多次生日、跨年，",
            "也終於一起出國玩了。",
            "希望以後還可以一起去更多地方。"
          ]
        },
        sec3: {
          groupA: [
            "除了那些特別的日子，",
            "我也很喜歡我們平常的日常見見。",
            "下班見面、看電影、吃宵夜，",
            "然後又不小心深夜未歸。",
            "週末再送寶寶去松山車站。"
          ],
          groupB: [
            "每次見面都好開心，",
            "所以忍不住一直講屁話。",
            "希望寶寶以後不會因此需要戴助聽器。"
          ]
        },
        sec4: {
          groupA: [
            { text: "早安安安安安安。", align: "align-left" },
            { text: "啾啾啾。", align: "align-right" },
            { text: "抱抱抱。", align: "align-left" },
            { text: "舔舔舔。", align: "align-center" },
            { text: "咬咬咬。", align: "align-right" },
            { text: "晚安安安安安安。", align: "align-left" }
          ],
          groupB: [
            { text: "辣雞翅雞腿。", align: "align-left" },
            { text: "恩。", align: "align-right" },
            { text: ":3", align: "align-center" },
            { text: "舔痣、聞鉛筆、洗腳腳。", align: "align-left" }
          ],
          groupC: [
            "我們真的有好多奇怪的習慣。",
            "但想想又覺得蠻可愛的。"
          ]
        },
        sec5: {
          groupA: [
            "今年對我來說還是有點辛苦。",
            "有時候會想太多，",
            "也還是很容易逞強、放不下自尊。"
          ],
          groupB: [
            "謝謝寶寶這一年陪我這麼多。",
            "我有記得你跟我說過，",
            "我們應該要互相照顧。"
          ],
          groupC: [
            "雖然我偶爾還是會鬼打牆，",
            "但我真的有放在心上。",
            "謝謝你一直當我的後盾。",
            "我也會好好照顧你的。"
          ]
        },
        sec6: {
          groupA: [
            "今年森森出生了！",
            "看到他這麼可愛，",
            "有時候也會想，",
            "如果以後我們也有自己的小寶寶，",
            "不知道會是什麼樣子。",
            "好希望以後我們也能有自己的幸福家庭。"
          ],
          groupB: [
            "從 2022 年到現在，",
            "已經一起過了四年。",
            "希望以後還有好多次生日、",
            "好多場電影、好多頓宵夜，",
            "還有好多好多次啾啾啾、抱抱抱。",
            "也希望你的事業越來越有成就，",
            "宵夜時光屋大爆紅！",
            "以後也繼續一起做很多事情吧！"
          ],
          finale: [
            "未來的時間就跟你預約囉。",
            "2026 年度生日快樂，臭寶哺！",
            "愛你",
            "  ",
            "愛你ㄉ狗勾"
          ]
        }
      }
    };

    /* ==========================================================================
       DOM 文字與圖片注入
       ========================================================================== */
    function appendPoemLines(containerId, lines, gapIndices = []) {
      const container = document.getElementById(containerId);
      if (!container) return;
      lines.forEach((line, idx) => {
        const p = document.createElement("p");
        p.className = "poem-line" + (gapIndices.includes(idx) ? " gap-top" : "");
        p.textContent = line;
        container.appendChild(p);
      });
    }

    function appendScatterLines(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      items.forEach((item) => {
        const p = document.createElement("p");
        p.className = "scatter-line " + (item.align || "align-center");
        p.textContent = item.text;
        container.appendChild(p);
      });
    }

    function initContent() {
      const imgMap = {
        "img-cover": SITE_CONFIG.images.cover,
        "img-sec1": SITE_CONFIG.images.sec1,
        "img-sec2": SITE_CONFIG.images.sec2,
        "img-sec3": SITE_CONFIG.images.sec3,
        "img-sec4": SITE_CONFIG.images.sec4,
        "img-sec5": SITE_CONFIG.images.sec5,
        "img-sec6": SITE_CONFIG.images.sec6
      };

      Object.entries(imgMap).forEach(([id, src]) => {
        const img = document.getElementById(id);
        if (!img) return;
        img.src = src;
        img.onerror = () => {
          img.style.display = "none";
        };
      });

      document.getElementById("hero-play-text").textContent = SITE_CONFIG.playButtonText;

      appendPoemLines("sec1-group", SITE_CONFIG.texts.sec1);
      appendPoemLines("sec2-group-a", SITE_CONFIG.texts.sec2.groupA, [2]);
      appendPoemLines("sec2-group-b", SITE_CONFIG.texts.sec2.groupB, [1]);
      appendPoemLines("sec3-group-a", SITE_CONFIG.texts.sec3.groupA, [2]);
      appendPoemLines("sec3-group-b", SITE_CONFIG.texts.sec3.groupB, [2]);

      appendScatterLines("sec4-group-a", SITE_CONFIG.texts.sec4.groupA);
      appendScatterLines("sec4-group-b", SITE_CONFIG.texts.sec4.groupB);
      appendPoemLines("sec4-group-c", SITE_CONFIG.texts.sec4.groupC);

      appendPoemLines("sec5-group-a", SITE_CONFIG.texts.sec5.groupA);
      appendPoemLines("sec5-group-b", SITE_CONFIG.texts.sec5.groupB);
      appendPoemLines("sec5-group-c", SITE_CONFIG.texts.sec5.groupC, [2]);

      appendPoemLines("sec6-group-a", SITE_CONFIG.texts.sec6.groupA, [2, 5]);
      appendPoemLines("sec6-group-b", SITE_CONFIG.texts.sec6.groupB, [2, 5, 7]);
      appendPoemLines("sec6-group-finale", SITE_CONFIG.texts.sec6.finale, [1, 2]);
    }

    /* ==========================================================================
       背景微光粒子動態
       ========================================================================== */
    function initOrganicCanvas() {
      const canvas = document.getElementById("organic-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let w = 0;
      let h = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      resize();
      window.addEventListener("resize", resize, { passive: true });

      const orbs = Array.from({ length: 4 }, (_, i) => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.min(w, h) * (0.25 + i * 0.06),
        vx: (Math.random() - 0.5) * 0.14,
        vy: (Math.random() - 0.5) * 0.14,
        phase: i * 1.6
      }));

      const motes = Array.from({ length: 20 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        size: 0.7 + Math.random() * 1.1,
        vy: -0.07 - Math.random() * 0.12,
        vx: (Math.random() - 0.5) * 0.08,
        alpha: 0.1 + Math.random() * 0.2,
        phase: Math.random() * Math.PI * 2
      }));

      let t = 0;
      function draw() {
        t += 0.008;
        ctx.clearRect(0, 0, w, h);

        orbs.forEach((orb) => {
          orb.x += orb.vx + Math.sin(t + orb.phase) * 0.12;
          orb.y += orb.vy + Math.cos(t * 0.8 + orb.phase) * 0.12;
          if (orb.x < -orb.r) orb.x = w + orb.r;
          if (orb.x > w + orb.r) orb.x = -orb.r;
          if (orb.y < -orb.r) orb.y = h + orb.r;
          if (orb.y > h + orb.r) orb.y = -orb.r;

          const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
          grad.addColorStop(0, "rgba(255, 248, 238, 0.032)");
          grad.addColorStop(1, "rgba(255, 248, 238, 0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
          ctx.fill();
        });

        motes.forEach((m) => {
          m.x += m.vx + Math.sin(t * 1.4 + m.phase) * 0.06;
          m.y += m.vy;
          if (m.y < -10) {
            m.y = h + 10;
            m.x = Math.random() * w;
          }
          const a = m.alpha * (0.55 + 0.45 * Math.sin(t * 1.8 + m.phase));
          ctx.fillStyle = `rgba(255, 255, 255, ${a.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }

    /* ==========================================================================
       背景音樂播放器（點擊後持續播放，不受捲動影響）
       ========================================================================== */
    function initAudioPlayer() {
      const audioEl = document.getElementById("bg-audio");
      const heroBtn = document.getElementById("hero-play-btn");
      const cornerBtn = document.getElementById("corner-music-btn");
      const cornerLabel = document.getElementById("corner-music-label");
      const toast = document.getElementById("audio-toast");

      let isPlaying = false;
      let audioCtx = null;
      let padTimer = null;

      if (SITE_CONFIG.musicUrl) {
        audioEl.src = SITE_CONFIG.musicUrl;
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toast.classList.remove("show"), 3200);
      }

      function startFallbackPiano() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const chords = [
          [261.63, 329.63, 392.00, 493.88],
          [220.00, 261.63, 329.63, 392.00],
          [174.61, 220.00, 261.63, 349.23],
          [196.00, 246.94, 293.66, 392.00]
        ];
        let step = 0;

        function playChord() {
          if (!isPlaying || !audioCtx) return;
          const now = audioCtx.currentTime;
          const notes = chords[step % chords.length];
          step++;
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.0001, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.02, now + idx * 0.14 + 0.9);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 4.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 4.6);
          });
        }

        playChord();
        padTimer = setInterval(playChord, 4400);
      }

      function stopFallbackPiano() {
        clearInterval(padTimer);
        padTimer = null;
      }

      function updateUI(playing) {
        isPlaying = playing;
        cornerBtn.classList.add("visible");
        cornerBtn.classList.toggle("playing", playing);
        cornerLabel.textContent = playing ? "PLAYING" : "PAUSED";
        document.getElementById("hero-play-text").textContent = playing ? "Playing..." : SITE_CONFIG.playButtonText;
      }

      async function toggleMusic() {
        if (!isPlaying) {
          if (SITE_CONFIG.musicUrl) {
            try {
              await audioEl.play();
              updateUI(true);
            } catch (err) {
              showToast("無法播放音訊，請確認檔案路徑");
            }
          } else {
            startFallbackPiano();
            updateUI(true);
            showToast("預覽鋼琴模式（填入 musicUrl 可換成你的音樂）");
          }
        } else {
          if (SITE_CONFIG.musicUrl) {
            audioEl.pause();
          } else {
            stopFallbackPiano();
          }
          updateUI(false);
        }
      }

      heroBtn.addEventListener("click", toggleMusic);
      cornerBtn.addEventListener("click", toggleMusic);
    }

    /* ==========================================================================
       GSAP ScrollTrigger 滾動視差與防重疊文字進退場
       ========================================================================== */
    function initScrollAnimations() {
      if (typeof gsap === "undefined" || typeof ScrollTrigger === "undefined") {
        document.querySelectorAll(".beat-layer, .scatter-layer").forEach((el) => {
          el.style.position = "relative";
          el.style.opacity = "1";
          el.style.visibility = "visible";
        });
        return;
      }

      gsap.registerPlugin(ScrollTrigger);

      // 強制確保一進入頁面時，封面黑色遮罩與四周暗角為全透明（0）
      gsap.set("#cover-shade", { opacity: 0 });
      gsap.set("#vignette-overlay", { opacity: 0 });

      // 右側捲動進度條
      gsap.to("#scroll-thumb", {
        height: "100%",
        ease: "none",
        scrollTrigger: {
          trigger: "#story-container",
          start: "top top",
          end: "bottom bottom",
          scrub: true
        }
      });

      // 1. Cover 封面：固定在原地（pin: true），從全透明原圖隨著往下捲動慢慢淡入黑色半透明遮罩，不會先變全黑
      const coverTl = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-cover",
          start: "top top",
          end: "+=140%",
          pin: true,
          scrub: 0.7,
          anticipatePin: 1
        }
      });
      coverTl
        .to("#cover-shade", { opacity: 1, duration: 1, ease: "none" }, 0)
        .to("#vignette-overlay", { opacity: 1, duration: 1, ease: "none" }, 0)
        .to("#scene-cover .scene-bg", { scale: 1.06, filter: "blur(2px) contrast(1.03)", duration: 1, ease: "none" }, 0)
        .to("#cover-ui", { opacity: 0, y: -20, duration: 0.65, ease: "power2.in" }, 0.15);

      // 輔助：加入一組完整的進場與退場動畫（確保退場後 autoAlpha: 0 徹底隱藏）
      function addBeat(tl, layerSelector, lineSelector, startAt, holdDuration) {
        const lines = gsap.utils.toArray(lineSelector);
        if (!lines.length) return startAt;

        tl.set(layerSelector, { autoAlpha: 1 }, startAt);

        tl.fromTo(
          lines,
          { opacity: 0, y: 18, filter: "blur(4px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.95,
            stagger: 0.24,
            ease: "power3.out"
          },
          startAt + 0.05
        );

        const exitAt = startAt + 0.05 + (lines.length - 1) * 0.24 + 0.95 + holdDuration;

        tl.to(
          lines,
          {
            opacity: 0,
            y: -14,
            filter: "blur(3px)",
            duration: 0.75,
            stagger: 0.1,
            ease: "power2.inOut"
          },
          exitAt
        );

        const endAt = exitAt + (lines.length - 1) * 0.1 + 0.8;
        tl.set(layerSelector, { autoAlpha: 0 }, endAt);
        return endAt;
      }

      // 2. Section 1：給偶的小寶寶
      const tl1 = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-1",
          start: "top top",
          end: "+=230%",
          pin: true,
          scrub: 0.85,
          anticipatePin: 1
        }
      });
      tl1.fromTo(
        "#scene-1 .scene-bg",
        { scale: 1.08, yPercent: -2, filter: "blur(3px) contrast(1.03)" },
        { scale: 1.0, yPercent: 2, filter: "blur(0px) contrast(1.03)", duration: 4.5, ease: "none" },
        0
      );
      addBeat(tl1, "#sec1-group", "#sec1-group .poem-line", 0.3, 1.1);

      // 3. Section 2：2022–2026
      const tl2 = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-2",
          start: "top top",
          end: "+=380%",
          pin: true,
          scrub: 0.85,
          anticipatePin: 1
        }
      });
      tl2.fromTo(
        "#scene-2 .scene-bg",
        { scale: 1.0, yPercent: 2, filter: "blur(2px) contrast(1.03)" },
        { scale: 1.09, yPercent: -3, filter: "blur(0px) contrast(1.03)", duration: 8.5, ease: "none" },
        0
      );
      const t2AEnd = addBeat(tl2, "#sec2-group-a", "#sec2-group-a .poem-line", 0.3, 1.0);
      addBeat(tl2, "#sec2-group-b", "#sec2-group-b .poem-line", t2AEnd + 0.3, 1.1);

      // 4. Section 3：日常見見
      const tl3 = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-3",
          start: "top top",
          end: "+=340%",
          pin: true,
          scrub: 0.85,
          anticipatePin: 1
        }
      });
      tl3.fromTo(
        "#scene-3 .scene-bg",
        { scale: 1.07, xPercent: -1.5, filter: "blur(2px) contrast(1.03)" },
        { scale: 1.01, xPercent: 1.5, filter: "blur(0px) contrast(1.03)", duration: 7.5, ease: "none" },
        0
      );
      const t3AEnd = addBeat(tl3, "#sec3-group-a", "#sec3-group-a .poem-line", 0.3, 1.0);
      addBeat(tl3, "#sec3-group-b", "#sec3-group-b .poem-line", t3AEnd + 0.3, 1.1);

      // 5. Section 4：奇怪的小事（徹底分三組互斥進出，絕不重疊）
      const tl4 = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-4",
          start: "top top",
          end: "+=440%",
          pin: true,
          scrub: 0.85,
          anticipatePin: 1
        }
      });
      tl4.fromTo(
        "#scene-4 .scene-bg",
        { scale: 1.02, yPercent: 2, filter: "blur(2px) contrast(1.04)" },
        { scale: 1.1, yPercent: -2, filter: "blur(0.5px) contrast(1.04)", duration: 10, ease: "none" },
        0
      );
      const t4AEnd = addBeat(tl4, "#sec4-group-a", "#sec4-group-a .scatter-line", 0.3, 0.9);
      const t4BEnd = addBeat(tl4, "#sec4-group-b", "#sec4-group-b .scatter-line", t4AEnd + 0.35, 0.9);
      addBeat(tl4, "#sec4-group-c", "#sec4-group-c .poem-line", t4BEnd + 0.35, 1.1);

      // 6. Section 5：今年（三段式慢節奏，互斥顯示）
      const tl5 = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-5",
          start: "top top",
          end: "+=480%",
          pin: true,
          scrub: 1.0,
          anticipatePin: 1
        }
      });
      tl5.fromTo(
        "#scene-5 .scene-bg",
        { scale: 1.09, yPercent: -2, filter: "blur(3px) brightness(0.9)" },
        { scale: 1.01, yPercent: 2, filter: "blur(0.5px) brightness(0.95)", duration: 11, ease: "none" },
        0
      );
      const t5AEnd = addBeat(tl5, "#sec5-group-a", "#sec5-group-a .poem-line", 0.4, 1.3);
      const t5BEnd = addBeat(tl5, "#sec5-group-b", "#sec5-group-b .poem-line", t5AEnd + 0.4, 1.3);
      addBeat(tl5, "#sec5-group-c", "#sec5-group-c .poem-line", t5BEnd + 0.4, 1.4);

      // 7. Section 6：未來（組 B 退場後背景先全黑，再讓最後三句進場並停留在純黑結尾畫面）
      const tl6 = gsap.timeline({
        scrollTrigger: {
          trigger: "#scene-6",
          start: "top top",
          end: "+=560%",
          pin: true,
          scrub: 0.9,
          anticipatePin: 1
        }
      });
      tl6.fromTo(
        "#scene-6 .scene-bg",
        { scale: 1.0, yPercent: 2, filter: "blur(2px) contrast(1.03)" },
        { scale: 1.08, yPercent: -2, filter: "blur(0px) contrast(1.03)", duration: 9, ease: "none" },
        0
      );

      const t6AEnd = addBeat(tl6, "#sec6-group-a", "#sec6-group-a .poem-line", 0.3, 1.0);
      const t6BEnd = addBeat(tl6, "#sec6-group-b", "#sec6-group-b .poem-line", t6AEnd + 0.35, 1.2);

      // 背景幕布轉為純黑（z-index: 4，位於前景文字 z-index: 10 之下）
      const blackReadyAt = t6BEnd + 0.15;
      tl6.to(
        "#finale-curtain",
        { opacity: 1, duration: 1.0, ease: "power2.inOut" },
        blackReadyAt
      );

      // 在純黑背景上依序顯示最後三句並停留在結尾
      const finaleStartAt = blackReadyAt + 0.95;
      const finaleLines = gsap.utils.toArray("#sec6-group-finale .poem-line");
      tl6.set("#sec6-group-finale", { autoAlpha: 1 }, finaleStartAt);
      tl6.fromTo(
        finaleLines,
        { opacity: 0, y: 18, filter: "blur(4px)" },
        {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          duration: 1.05,
          stagger: 0.45,
          ease: "power3.out"
        },
        finaleStartAt + 0.05
      );

      // 結尾停留緩衝，滑到網頁最底部時文字穩穩停在純黑畫面上
      const finaleHoldEnd = finaleStartAt + 0.05 + (finaleLines.length - 1) * 0.45 + 1.05;
      tl6.to({}, { duration: 1.8 }, finaleHoldEnd);
    }

    window.addEventListener("DOMContentLoaded", () => {
      initContent();
      initOrganicCanvas();
      initAudioPlayer();
      initScrollAnimations();
    });
  </script>
